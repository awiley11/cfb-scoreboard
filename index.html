<!-- cfb-scoreboard v3 · 2026-10-17 · v2 board unchanged on desktop + phone/touch layout (body.m) -->
<!-- v2 · 2026-09-26 · conference filters, favorite conferences, upset watch -->
<style>
:root{
  --bg:#0a0d12; --card:#141a23; --card2:#1a222d; --line:#27313d; --fg:#f4f6f8; --muted:#8f9cab; --dim:#56626f;
  --live:#ff4b4b; --warn:#f2b640; --alert:#ff7a1a; --fav:#ffd166; --rz:#ff3b30; --ok:#41c76d; --panel:#0f141b; --btn:#1f2a36; --btn2:#2a3846;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
body.idle{cursor:none}
button{font:inherit;color:inherit;cursor:pointer}
body.demo #foot{background:rgba(242,182,64,.09);border-top-color:rgba(242,182,64,.5)}

/* ---------- board ---------- */
#board{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:1.2vmin;padding:1.2vmin;align-content:center;justify-content:center}
#board.empty{display:flex;align-items:center;justify-content:center}
.msg{max-width:60vw;text-align:center;color:var(--muted);font-size:2.4vmin;line-height:1.5}
.msg b{color:var(--fg)}
.msg .err{color:var(--warn)}
.msg kbd{background:var(--btn);border:1px solid var(--line);border-radius:.4em;padding:0 .4em;color:var(--fg)}

.card{position:relative;container-type:size;flex:0 0 auto;width:var(--cw,300px);height:var(--ch,190px);background:var(--card);border:1px solid var(--line);border-radius:1.2vmin;overflow:hidden;min-width:0;min-height:0}
.card.fav{border-color:#3a4656}
.card.rz{box-shadow:inset 0 0 0 .3vmin rgba(255,59,48,.55)}
.card.close::after{content:'';position:absolute;left:0;top:0;bottom:0;width:.55vmin;background:var(--live);border-radius:1.2vmin 0 0 1.2vmin}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.card.uw,.card.ua{overflow:visible}
.card.uw::before,.card.ua::before{content:'';position:absolute;inset:-.35vmin;border-radius:calc(1.2vmin + .35vmin);padding:.35vmin;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 55%,var(--sw) 78%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sweep 2.6s linear infinite}
.card.uw{--sw:var(--warn);box-shadow:0 0 2.2vmin rgba(242,182,64,.18)}
.card.ua{--sw:var(--alert);box-shadow:0 0 2.6vmin rgba(255,122,26,.3)}
.card.ua::before{animation-duration:1.6s}
@keyframes sweep{to{--a:360deg}}
.hd .st{flex:0 0 auto}
.hd .hr{display:flex;align-items:center;gap:calc(var(--u)*2.5);min-width:0}
.ctag{color:var(--dim);font-weight:700;letter-spacing:.08em;flex:0 0 auto}
.badge{flex:0 0 auto;font-size:calc(var(--u)*6);font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:calc(var(--u)*1) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.4);line-height:1.1}
.badge.uw{background:rgba(242,182,64,.16);color:var(--warn);border:1px solid rgba(242,182,64,.6)}
.badge.ua{background:rgba(255,122,26,.2);color:#ffb070;border:1px solid rgba(255,122,26,.75)}
.badge.uf{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
.c{--u:min(1cqh,.6cqw);height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*3) calc(var(--u)*5)}
.hd{flex:0 0 calc(var(--u)*13);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*3);
    font-size:calc(var(--u)*7);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.card.live .hd .st{color:var(--live)}
.card.warn .hd .st{color:var(--warn)}
.card.final .hd .st{color:var(--dim)}
.card.pre .hd .st{color:var(--fg);opacity:.85}
.hd .net{color:var(--dim);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:calc(var(--u)*4.5);height:calc(var(--u)*4.5);border-radius:50%;background:var(--live);margin-right:calc(var(--u)*2.5);vertical-align:middle;position:relative;top:calc(var(--u)*-.5);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.tm{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*3);border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*2)}
.tm.poss{background:rgba(255,255,255,.045)}
.card.rz .tm.poss{background:rgba(255,59,48,.14)}
.tm.loser{opacity:.5}
.logo{flex:0 0 auto;width:calc(var(--u)*19);height:calc(var(--u)*19);object-fit:contain;display:block}
.nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.name{font-size:calc(var(--u)*12.5);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.name.long{font-size:calc(var(--u)*10.5)}
.rk{font-size:.62em;font-weight:600;color:var(--muted);margin-right:.35em;vertical-align:.12em}
.sub{font-size:calc(var(--u)*5.8);color:var(--muted);white-space:nowrap;margin-top:calc(var(--u)*1.2);display:flex;align-items:center;gap:calc(var(--u)*3)}
.to{display:inline-flex;gap:calc(var(--u)*1)}
.to i{display:block;width:calc(var(--u)*3.2);height:calc(var(--u)*1.6);border-radius:1px;background:var(--fav)}
.to i.u{background:var(--dim);opacity:.6}
.ball{flex:0 0 auto;width:calc(var(--u)*9);height:calc(var(--u)*5.5);margin-right:calc(var(--u)*1)}
.sc{flex:0 0 auto;min-width:calc(var(--u)*30);text-align:right;font-size:calc(var(--u)*23);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.card.pre .sc{min-width:0}
.ft{flex:0 0 calc(var(--u)*11);display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*3);font-size:calc(var(--u)*6.5);color:var(--muted);white-space:nowrap}
.ft .fl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.card.live .ft .fl{color:var(--fg);opacity:.9}
.ft .fr{color:var(--dim);flex:0 0 auto}
.card.final.dimmed{opacity:.62}

/* ---------- footer: status + ticker ---------- */
#foot{flex:0 0 auto;display:flex;align-items:stretch;height:3.4vmin;min-height:22px;border-top:1px solid var(--line);background:#0c1016;font-size:1.55vmin;color:var(--muted)}
#status{flex:0 0 auto;display:flex;align-items:center;gap:1vmin;padding:0 1.4vmin;white-space:nowrap;border-right:1px solid var(--line)}
#status .demo{color:var(--warn);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
#status .err{color:var(--warn)}
#ticker{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
#ticker[hidden]{display:none}
.track{display:inline-flex;white-space:nowrap;will-change:transform}
.track.roll{animation:roll var(--dur,60s) linear infinite}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:.6em;padding:0 1.6vmin;border-right:1px solid var(--line);color:var(--fg);font-variant-numeric:tabular-nums}
.ti .k{color:var(--muted);font-size:.9em;text-transform:uppercase;letter-spacing:.04em}
.ti.live .k{color:var(--live)}
.ti .w{font-weight:700}
.ti .l{opacity:.55}
.ti .b{font-size:.78em;font-weight:800;letter-spacing:.08em;padding:.1em .5em;border-radius:.6em}
.ti .b.uw{color:var(--warn);border:1px solid rgba(242,182,64,.6)}
.ti .b.ua{color:#ffb070;border:1px solid rgba(255,122,26,.75)}
.ti .b.uf{color:var(--muted);border:1px solid var(--line)}

/* ---------- gear + panel ---------- */
#gear{flex:0 0 auto;height:100%;aspect-ratio:1;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-size:2.1vmin;display:flex;align-items:center;justify-content:center;padding:0}
#gear:hover{color:var(--fg);background:var(--btn)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:30;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;font-size:14px;color:var(--fg);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
#panel[hidden]{display:none}
#panel header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
#panel nav{display:flex;gap:4px}
#panel nav button{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 12px;color:var(--muted)}
#panel nav button.on{background:var(--btn);color:var(--fg);border-color:var(--line)}
#close{background:transparent;border:0;color:var(--muted);font-size:18px;padding:4px 8px}
#panel section{flex:1;overflow:auto;padding:12px}
#panel section[hidden]{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.ph b{color:var(--fg)}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg);font-size:13px}
.btn:hover{background:var(--btn2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.primary{background:#2b5cff;border-color:#2b5cff}
h4{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h4:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.04)}
.row input{margin:0;width:16px;height:16px;flex:0 0 auto;accent-color:#2b5cff}
.row .t{flex:0 0 74px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.row .g{flex:1 1 auto;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g .rk{font-size:11px;margin-right:2px}
.row .s{flex:0 0 auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row .s.live{color:var(--live);font-weight:600}
.row .star{flex:0 0 30px;color:var(--fav);font-size:13px;text-align:center}
.row.uw{box-shadow:inset 3px 0 0 var(--warn);background:rgba(242,182,64,.05)}
.row.ua{box-shadow:inset 3px 0 0 var(--alert);background:rgba(255,122,26,.07)}
.row.close{box-shadow:inset 3px 0 0 var(--live)}
.row .b{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 4px;border-radius:5px;white-space:nowrap}
.row .b.uw{color:var(--warn);border:1px solid rgba(242,182,64,.6)}
.row .b.ua{color:#ffb070;border:1px solid rgba(255,122,26,.75)}
.row .b.uf{color:var(--muted);border:1px solid var(--line)}
.row .cf{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.06em;margin-left:6px}
.row .auto{flex:0 0 auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;line-height:1.3}
.chip.on{background:var(--btn);color:var(--fg);border-color:#4a5a6c}
.chip.live.on{color:var(--live);border-color:rgba(255,75,75,.6)}
.chip small{color:var(--dim);margin-left:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 10px;color:var(--muted);font-size:12px}
.seg button.on{background:var(--btn);color:var(--fg)}
.ord{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px}
.ord .g{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .btn{padding:2px 7px}
.favrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:6px}
.favrow img{width:26px;height:26px;object-fit:contain}
.favrow .g{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px}
.tl:hover{background:rgba(255,255,255,.04)}
.tl img{width:22px;height:22px;object-fit:contain}
.tl .g{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .g small{color:var(--muted);margin-left:6px}
input[type=text],input[type=search],select,textarea{background:#0a0e14;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;width:100%}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.set label{color:var(--fg)}
.set small{display:block;color:var(--muted);margin-top:2px}
.set select{width:auto;min-width:120px}
.set input[type=checkbox]{width:18px;height:18px;accent-color:#2b5cff}
.keys{color:var(--muted);font-size:12px;line-height:1.7;margin-top:14px}
.keys kbd{background:var(--btn);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--fg);font-family:inherit}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
.muted{color:var(--muted)}
/* ---------- v3: phone / touch layer — everything here is scoped to body.m ---------- */
#mb{display:none}
@supports (height:100dvh){body.m{height:100dvh}}
body.m #board{gap:10px;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));touch-action:manipulation}
body.m #board.scroll{overflow-y:auto;align-content:flex-start;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body.m .msg{font-size:15px;max-width:min(92vw,520px)}
body.m .card{border-radius:12px}
body.m .card.close::after{width:4px;border-radius:12px 0 0 12px}
body.m .card.uw::before,body.m .card.ua::before{inset:-3px;padding:3px;border-radius:15px}
body.m .card.rz{box-shadow:inset 0 0 0 2px rgba(255,59,48,.55)}
body.m .card.uw{box-shadow:0 0 14px rgba(242,182,64,.18)}
body.m .card.ua{box-shadow:0 0 16px rgba(255,122,26,.3)}
body.m #foot{flex-wrap:wrap;height:auto;min-height:0;font-size:12px;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.m #ticker{order:-1;flex:0 0 100%;height:30px;border-bottom:1px solid var(--line);font-size:13px}
body.m .ti{padding:0 12px}
body.m #status{flex:1 1 0;min-width:0;overflow:hidden;border-right:0;padding:0 10px;gap:6px}
body.m #status>span{white-space:nowrap}
body.m #mb{display:flex;flex:0 0 auto}
#mb button,body.m #gear{height:44px;min-width:44px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:0 11px;-webkit-tap-highlight-color:transparent}
#mb button[aria-pressed=true]{color:var(--fg)}
#mb button[data-k=r]{font-size:19px;color:var(--muted)}
#mb button[hidden]{display:none}
body.m #gear{aspect-ratio:auto;width:48px;font-size:21px;color:var(--muted)}
#mb button:active,body.m #gear:active{background:var(--btn)}
body.m #panel{width:100vw;border-left:0;font-size:15px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@supports (height:100dvh){body.m #panel{bottom:auto;height:100dvh}}
body.m #panel header{padding:8px 10px}
body.m #panel nav button{padding:9px 14px}
body.m #close{font-size:22px;padding:8px 12px}
body.m .btn{padding:9px 12px;font-size:14px}
body.m .btn.sm{padding:7px 11px;font-size:13px}
body.m .chips{gap:8px}
body.m .chip{padding:7px 12px;font-size:13px}
body.m .seg button{padding:8px 12px;font-size:13px}
body.m input[type=text],body.m input[type=search],body.m select,body.m textarea{font-size:16px}
body.m .set input[type=checkbox]{width:24px;height:24px}
body.m .row{display:grid;grid-template-columns:22px auto 1fr 24px;grid-template-areas:"cb g g star" "cb t s star";column-gap:10px;row-gap:3px;padding:10px 8px}
body.m .row input{grid-area:cb;width:20px;height:20px}
body.m .row .t{grid-area:t;flex:none;font-size:12px}
body.m .row .g{grid-area:g;min-width:0;font-size:15px}
body.m .row .s{grid-area:s;text-align:right;font-size:12px}
body.m .row .star{grid-area:star}
body.m .ord,body.m .favrow,body.m .tl{padding:8px}
body.m .ord .btn{padding:7px 12px}
body.m .keys{display:none}
@media (min-width:701px){body.m #foot{flex-wrap:nowrap}body.m #ticker{order:0;flex:1 1 auto;height:auto;border-bottom:0}body.m #status{flex:0 0 auto;border-right:1px solid var(--line)}}
</style>
</head>

// v3: phone / touch mode. Narrow screens and touch-first devices get a scrolling board and tap controls.
const MQ = matchMedia('(max-width: 700px), (pointer: coarse)');
let M = MQ.matches;
document.body.classList.toggle('m', M);

// ---------- data ----------
let games = [], week = null, season = null, lastOk = 0, lastErr = '', loading = false, nextAt = 0, timer = null;
let allTeams = null;

function normalize(ev) {
  const comp = (ev.competitions && ev.competitions[0]) || {};
  const st = comp.status || ev.status || {};
  const t = st.type || {};
  const cs = comp.competitors || [];
  const awayC = cs.find(c => c.homeAway === 'away') || cs[1] || {};
  const homeC = cs.find(c => c.homeAway === 'home') || cs[0] || {};
  const sit = comp.situation || null;
  const team = (c, tos) => {
    const tm = c.team || {};
    const rank = c.curatedRank && c.curatedRank.current;
    const rec = (c.records || []).find(r => r.type === 'total' || r.name === 'overall');
    return {
      id: String(tm.id ?? ''), name: tm.shortDisplayName || tm.displayName || tm.name || '?',
      abbr: tm.abbreviation || '', logo: tm.logo || (tm.logos && tm.logos[0] && tm.logos[0].href) || '',
      score: c.score != null ? String(c.score) : '', rank: rank && rank <= 25 ? rank : null,
      record: rec ? (rec.summary || '') : '', winner: !!c.winner, timeouts: (tos == null ? null : tos),
      conf: tm.conferenceId != null ? String(tm.conferenceId) : '',
    };
  };
  const bc = (comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names && comp.broadcasts[0].names[0])
    || ((comp.geoBroadcasts || []).find(g => g.type && g.type.shortName === 'TV') || {}).media?.shortName || '';
  const away = team(awayC, sit && sit.awayTimeouts), home = team(homeC, sit && sit.homeTimeouts);
  const o = comp.odds && comp.odds[0];
  let odds = null;
  if (o) {
    let spread = typeof o.spread === 'number' ? Math.abs(o.spread) : NaN;
    if (isNaN(spread)) { const m = /-(\d+(?:\.\d+)?)\s*$/.exec(o.details || ''); if (m) spread = parseFloat(m[1]); }
    let favId = null;
    if (o.homeTeamOdds && o.homeTeamOdds.favorite) favId = home.id;
    else if (o.awayTeamOdds && o.awayTeamOdds.favorite) favId = away.id;
    else if (typeof o.spread === 'number' && o.spread !== 0) favId = o.spread < 0 ? home.id : away.id;
    else if (o.details) { const ab = (o.details.split(' ')[0] || '').toUpperCase(); if (ab === home.abbr) favId = home.id; else if (ab === away.abbr) favId = away.id; }
    odds = { details: o.details || '', ou: o.overUnder, spread: isNaN(spread) ? null : spread, favId, dogId: favId ? (favId === home.id ? away.id : home.id) : null };
  }
  const venue = comp.venue ? [comp.venue.fullName, comp.venue.address && comp.venue.address.city, comp.venue.address && comp.venue.address.state].filter(Boolean).join(', ') : '';
  const anyWinner = !!(awayC.winner || homeC.winner);
  return {
    id: String(ev.id), date: new Date(comp.date || ev.date), name: ev.shortName || ev.name || '',
    state: t.state || 'pre', statusName: t.name || '', detail: t.shortDetail || t.detail || '', completed: !!t.completed,
    period: st.period || 0, clock: st.displayClock || '',
    away, home, anyWinner, confGame: !!comp.conferenceCompetition,
    possession: sit && sit.possession ? String(sit.possession) : null,
    downDistance: (sit && (sit.downDistanceText || sit.shortDownDistanceText)) || '',
    redZone: !!(sit && sit.isRedZone), lastPlay: (sit && sit.lastPlay && sit.lastPlay.text) || '',
    network: bc, odds,
    venue, neutral: !!comp.neutralSite,
  };
}

function ingest(json) {
  const evs = (json && json.events) || [];
  games = evs.map(normalize).filter(g => g.id);
  week = json && json.week && json.week.number || null;
  season = json && json.season && json.season.year || null;
  // prune per-week state that refers to games no longer in the slate
  const ids = new Set(games.map(g => g.id));
  let changed = false;
  for (const k of Object.keys(state.overrides)) if (!ids.has(k)) { delete state.overrides[k]; changed = true; }
  const ord = state.order.filter(id => ids.has(id));
  if (ord.length !== state.order.length) { state.order = ord; changed = true; }
  if (changed) save();
}

async function fetchJSON(url) {
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 15000);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(to); }
}
function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }

function demoData() {
  const raw = JSON.parse(document.getElementById('demo-data').textContent);
  // shift the fixture's Saturday onto today so kickoff times read naturally
  const ref = new Date(2026, 8, 26), today = new Date(); today.setHours(0, 0, 0, 0);
  const delta = today - ref;
  for (const ev of raw.events) {
    const d = new Date(new Date(ev.date).getTime() + delta).toISOString();
    ev.date = d; if (ev.competitions && ev.competitions[0]) ev.competitions[0].date = d;
  }
  return raw;
}

async function refresh() {
  if (loading) return;
  loading = true; renderStatus();
  try {
    let json;
    if (state.demo) {
      json = demoData();
    } else {
      json = await fetchJSON(API + '/scoreboard?groups=80&limit=300&_=' + Date.now());
      if (!json.events || !json.events.length) {
        // off-week or odd calendar edge: fall back to today's date explicitly
        json = await fetchJSON(API + '/scoreboard?groups=80&limit=300&dates=' + ymd(new Date()) + '&_=' + Date.now());
      }
    }
    ingest(json); lastOk = Date.now(); lastErr = '';
  } catch (e) {
    lastErr = (e && e.name === 'AbortError') ? 'timed out' : ((e && e.message) || String(e));
  } finally {
    loading = false;
    nextAt = Date.now() + state.refresh * 1000;
    renderAll();
  }
}
function schedule() {
  clearInterval(timer);
  timer = setInterval(() => { if (Date.now() >= nextAt) refresh(); }, 1000);
}

// ---------- upset watch / close game / conference label ----------
function isLate(g) { return g.state === 'in' && g.period >= (state.late === '2h' ? 3 : 4); }
function upsetOf(g) {
  if (g.state === 'pre') return null;
  const th = +state.upsetSpread || 0;
  let dogId = null, size = null, basis = 'line';
  if (g.odds && g.odds.dogId && g.odds.spread != null) { dogId = g.odds.dogId; size = g.odds.spread; }
  else if (g.away.rank && !g.home.rank) { dogId = g.home.id; size = 7; basis = 'rank'; }
  else if (g.home.rank && !g.away.rank) { dogId = g.away.id; size = 7; basis = 'rank'; }
  if (!dogId || size < th) return null;
  const dog = dogId === g.home.id ? g.home : g.away, fav = dog === g.home ? g.away : g.home;
  const ds = +dog.score || 0, fs = +fav.score || 0;
  if (g.state === 'post') return (g.anyWinner ? dog.winner : ds > fs) ? { tier: 'final', dog, fav, size, basis } : null;
  if (!isLate(g)) return null;
  if (ds > fs) return { tier: 'alert', dog, fav, size, basis };
  if (fs - ds <= 8) return { tier: 'watch', dog, fav, size, basis };
  return null;
}
const autoStuck = new Set();   // games the upset watch pulled onto the board stay until they end
function annotate() {
  for (const g of games) {
    g.up = upsetOf(g);
    g.close = isLate(g) && Math.abs((+g.home.score || 0) - (+g.away.score || 0)) <= 8;
    g.confLabel = g.confGame || g.away.conf === g.home.conf ? confShort(g.home.conf) : [confShort(g.away.conf), confShort(g.home.conf)].filter(Boolean).join('–');
    if (g.state === 'post') autoStuck.delete(g.id);
  }
}
const UPSET_LABEL = { watch: 'Upset watch', alert: 'Upset alert', final: 'Upset' };
const upCls = g => g.up ? (g.up.tier === 'watch' ? 'uw' : g.up.tier === 'alert' ? 'ua' : 'uf') : '';
function upsetBadge(g, cls) { return g.up ? '<span class="' + (cls || 'badge') + ' ' + upCls(g) + '">' + UPSET_LABEL[g.up.tier] + '</span>' : ''; }

// ---------- selection & ordering ----------
const favIds = () => new Set(state.favorites.map(f => String(f.id)));
const favConfSet = () => new Set(state.favConfs);
function isFavGame(g, fs) { fs = fs || favIds(); const fc = favConfSet(); return fs.has(g.away.id) || fs.has(g.home.id) || (!!g.away.conf && fc.has(g.away.conf)) || (!!g.home.conf && fc.has(g.home.conf)); }
function isAutoUpset(g) { return !!(state.autoUpset && g.state === 'in' && ((g.up && g.up.tier !== 'final') || autoStuck.has(g.id))); }
function isPicked(g, fs) {
  const o = state.overrides[g.id];
  if (o != null) return !!o;
  if (isFavGame(g, fs)) return true;
  if (isAutoUpset(g)) { autoStuck.add(g.id); return true; }
  return false;
}
function stateRank(g) { return g.state === 'in' ? 0 : g.state === 'pre' ? 1 : 2; }
function dramaRank(g) { return g.up && g.up.tier === 'alert' ? 0 : g.up && g.up.tier === 'watch' ? 1 : g.close ? 2 : 3; }
function autoSort(list, fs) {
  return list.slice().sort((a, b) => stateRank(a) - stateRank(b) || dramaRank(a) - dramaRank(b) || (isFavGame(b, fs) - isFavGame(a, fs)) || (a.date - b.date));
}
function confSortKey(g, fs) {
  // in-conference game → its conference; otherwise the favorite team's conference, else the home team's
  if (g.confGame || g.away.conf === g.home.conf) return confName(g.home.conf);
  if (fs.has(g.away.id) && !fs.has(g.home.id)) return confName(g.away.conf);
  return confName(g.home.conf);
}
function boardGames() {
  const fs = favIds();
  let list = games.filter(g => isPicked(g, fs));
  if (state.finals === 'hide') list = list.filter(g => g.state !== 'post');
  list = autoSort(list, fs);
  if (state.orderMode === 'conf') {
    list.sort((a, b) => confSortKey(a, fs).localeCompare(confSortKey(b, fs)) || stateRank(a) - stateRank(b) || dramaRank(a) - dramaRank(b) || (a.date - b.date));
  } else if (state.orderMode === 'manual') {
    const idx = new Map(state.order.map((id, i) => [id, i]));
    const missing = list.filter(g => !idx.has(g.id)).map(g => g.id);
    if (missing.length) { state.order = state.order.concat(missing); save(); state.order.forEach((id, i) => idx.set(id, i)); }
    list.sort((a, b) => idx.get(a.id) - idx.get(b.id));
  }
  return list;
}

// ---------- formatting ----------
const ORD = ['', '1st', '2nd', '3rd', '4th'];
function periodLabel(p) { return p <= 4 ? (ORD[p] || '') : (p === 5 ? 'OT' : (p - 4) + 'OT'); }
function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function fmtKick(d) { const now = new Date(); return (sameDay(d, now) ? '' : d.toLocaleDateString([], { weekday: 'short' }) + ' ') + fmtTime(d); }
function statusLabel(g) {
  const n = g.statusName;
  if (n === 'STATUS_HALFTIME') return { text: 'Halftime', kind: 'live' };
  if (n === 'STATUS_END_PERIOD') return { text: 'End ' + periodLabel(g.period), kind: 'live' };
  if (n === 'STATUS_DELAYED') return { text: 'Delayed' + (g.clock && g.period ? ' · ' + g.clock + ' ' + periodLabel(g.period) : ''), kind: 'warn' };
  if (n === 'STATUS_POSTPONED') return { text: 'Postponed', kind: 'warn' };
  if (n === 'STATUS_CANCELED') return { text: 'Canceled', kind: 'warn' };
  if (g.state === 'post') return { text: g.period > 4 ? 'Final/' + periodLabel(g.period) : 'Final', kind: 'final' };
  if (g.state === 'in') return { text: (g.clock || '') + ' · ' + periodLabel(g.period), kind: 'live' };
  return { text: fmtKick(g.date), kind: 'pre' };
}
function footerText(g) {
  if (g.state === 'in') return g.downDistance || g.lastPlay || g.venue;
  if (g.state === 'pre') return (state.showOdds && g.odds && g.odds.details) ? (g.odds.details + (g.odds.ou ? ' · O/U ' + g.odds.ou : '')) : g.venue;
  return g.venue;
}
function matchup(g, withRank) {
  const r = t => (withRank && t.rank ? '<span class="rk">' + t.rank + '</span>' : '') + esc(t.abbr || t.name);
  return r(g.away) + (g.neutral ? ' vs ' : ' @ ') + r(g.home);
}

// ---------- rendering ----------
const board = $('#board'), track = $('#track'), tickerEl = $('#ticker'), statusEl = $('#status'), panel = $('#panel');
let lastTicker = '';

function renderAll() { annotate(); document.body.classList.toggle('demo', !!state.demo); syncMB(); renderBoard(); renderTicker(); renderStatus(); if (!panel.hidden) renderPanel(); }

function renderBoard() {
  const list = boardGames();
  if (!list.length) {
    board.className = 'empty';
    let html;
    if (!games.length && lastErr && !lastOk) {
      html = '<b>Couldn\'t load the scoreboard.</b><br><span class="err">' + esc(lastErr) + '</span><br><br>' +
        (lastErr.includes('Failed to fetch') || lastErr.includes('NetworkError') || lastErr.includes('Load failed')
          ? 'The browser could not reach ESPN\'s feed — check the network, or if you are online the feed may have started refusing browser requests (that needs a fix to the page, not to your setup).'
          : 'Retrying automatically.') + '<br><br><span class="muted">' + (M ? 'Turn on Demo data in &#9881; Settings to check the layout.' : 'Press <kbd>D</kbd> for demo data to check the layout.') + '</span>';
    } else if (!games.length && (loading || !lastOk)) {
      html = 'Loading this week\'s FBS scoreboard…';
    } else if (!games.length) {
      html = '<b>No FBS games found for this week.</b><br><span class="muted">ESPN returned an empty slate — off week or offseason.</span>';
    } else {
      const favs = state.favorites.map(f => f.name).join(', ');
      const fs = favIds(), favGames = games.filter(g => isFavGame(g, fs));
      let why = '';
      if (!favs) why = ', or add favorite teams so their games show automatically.';
      else if (!favGames.length) why = '.<br><span class="muted">Favorites (' + esc(favs) + ') have no game in this week\'s slate.</span>';
      else if (favGames.every(g => state.overrides[g.id] === false)) why = '.<br><span class="muted">The favorites\' games were unticked in Picks — "Reset to favorites" brings them back.</span>';
      else why = '.<br><span class="muted">The favorites\' games are final and finals are hidden (' + (M ? 'tap Finals' : 'press <kbd>H</kbd>') + ' to show them).</span>';
      html = '<b>Nothing on the board yet.</b><br>' + (M ? 'Tap &#9881; to pick games' : 'Press <kbd>P</kbd> or the gear to pick games') + why;
    }
    board.innerHTML = '<div class="msg">' + html + '</div>';
    return;
  }
  const keepTop = board.scrollTop;
  board.className = M && board.classList.contains('scroll') ? 'scroll' : '';
  const n = list.length;
  const mw = M ? layout(n) : 0;
  const useAbbr = state.labels === 'abbr' || (state.labels === 'auto' && (M ? mw < 300 : n >= 9));
  const fs = favIds();
  board.innerHTML = list.map(g => card(g, useAbbr, fs)).join('');
  layout(n);
  if (M) board.scrollTop = keepTop;
}

function card(g, useAbbr, fs) {
  const st = statusLabel(g);
  const live = g.state === 'in';
  const cls = ['card', st.kind, isFavGame(g, fs) ? 'fav' : '', g.redZone && live ? 'rz' : '', st.kind === 'final' && state.finals === 'dim' ? 'dimmed' : '',
    g.up && g.up.tier !== 'final' ? upCls(g) : '', state.closeEdge && g.close && !(g.up && g.up.tier !== 'final') ? 'close' : ''].filter(Boolean).join(' ');
  return '<div class="' + cls + '" data-id="' + esc(g.id) + '"><div class="c">' +
    '<div class="hd"><span class="st">' + (st.kind === 'live' ? '<i class="dot"></i>' : '') + esc(st.text) + '</span>' +
    '<span class="hr">' + (state.confTags && g.confLabel ? '<span class="ctag">' + esc(g.confLabel) + '</span>' : '') +
    '<span class="net">' + (state.showNetwork ? esc(g.network) : '') + '</span></span></div>' +
    teamRow(g, g.away, useAbbr, live) + teamRow(g, g.home, useAbbr, live) +
    '<div class="ft"><span class="fl">' + esc(footerText(g)) + '</span><span class="fr">' + (g.up ? upsetBadge(g) : (g.neutral ? 'Neutral site' : '')) + '</span></div>' +
    '</div></div>';
}
function teamRow(g, t, useAbbr, live) {
  const poss = live && g.possession && g.possession === t.id;
  const loser = g.state === 'post' && g.anyWinner && !t.winner;
  const name = useAbbr ? (t.abbr || t.name) : t.name;
  const long = !useAbbr && name.length > 12 ? ' long' : '';
  let to = '';
  if (live && t.timeouts != null) {
    const k = Math.max(0, Math.min(3, t.timeouts));
    to = '<span class="to">' + '<i></i>'.repeat(k) + '<i class="u"></i>'.repeat(3 - k) + '</span>';
  }
  return '<div class="tm' + (poss ? ' poss' : '') + (loser ? ' loser' : '') + '">' +
    (t.logo ? '<img class="logo" src="' + esc(t.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<span class="logo"></span>') +
    '<div class="nm"><span class="name' + long + '">' + (t.rank ? '<span class="rk">' + t.rank + '</span>' : '') + esc(name) + '</span>' +
    '<span class="sub">' + (state.showRecords && t.record ? '<span>' + esc(t.record) + '</span>' : '') + to + '</span></div>' +
    (poss ? FOOTBALL : '') +
    '<span class="sc">' + (g.state === 'pre' ? '' : esc(t.score)) + '</span></div>';
}

function layout(n) {
  if (!n) return;
  const cs = getComputedStyle(board);
  const gap = parseFloat(cs.gap) || 0, padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const W = board.clientWidth - padX, H = board.clientHeight - padY;
  if (W <= 0 || H <= 0) return;
  const target = 1.6;
  let best = { c: 1, s: -1 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = (W - gap * (c - 1)) / c, ch = (H - gap * (r - 1)) / r;
    const s = Math.min(cw / target, ch);            // the scale at which a target-aspect card fits the cell
    if (s > best.s) best = { c, s, cw, ch, r };
  }
  const { c, r, cw, ch } = best;
  let w = Math.floor(Math.min(cw, ch * ASPECT_MAX)), h = Math.floor(Math.min(ch, cw / ASPECT_MIN));
  if (M) {
    // phone: keep the one-screen fit while cards stay readable, otherwise scroll a grid of full-size cards
    if (w >= 280 && h >= 150) board.classList.remove('scroll');
    else {
      const cols = Math.max(1, Math.floor((W + gap) / (340 + gap)));
      w = Math.floor((W - gap * (cols - 1)) / cols); h = Math.round(w / 1.9);
      board.classList.add('scroll');
    }
  }
  board.style.setProperty('--cw', w + 'px');
  board.style.setProperty('--ch', h + 'px');
  return w;
}
let lastBW = 0;
new ResizeObserver(() => {
  const n = board.querySelectorAll('.card').length; if (!n) return;
  if (M && board.clientWidth !== lastBW) { lastBW = board.clientWidth; renderBoard(); } else layout(n);
}).observe(board);

function renderTicker() {
  if (!state.ticker) { tickerEl.hidden = true; lastTicker = ''; return; }
  tickerEl.hidden = false;
  const onBoard = new Set(boardGames().map(g => g.id));
  const fs = favIds();
  const rest = autoSort(games.filter(g => !onBoard.has(g.id)), fs);
  if (!rest.length) { if (lastTicker !== '-') { track.className = 'track'; track.innerHTML = '<span class="ti muted">' + (games.length ? 'Every game this week is on the board' : '') + '</span>'; lastTicker = '-'; } return; }
  const item = g => {
    const st = statusLabel(g);
    const pre = g.state === 'pre';
    const side = t => '<span class="' + (g.state === 'post' && g.anyWinner ? (t.winner ? 'w' : 'l') : '') + '">' + (t.rank ? '<span class="rk">' + t.rank + '</span>' : '') + esc(t.abbr || t.name) + (pre ? '' : ' ' + esc(t.score)) + '</span>';
    return '<span class="ti ' + st.kind + '">' + side(g.away) + '<span class="muted">' + (pre ? (g.neutral ? 'vs' : '@') : '') + '</span>' + side(g.home) + '<span class="k">' + esc(st.text) + '</span>' + upsetBadge(g, 'b') + '</span>';
  };
  const html = rest.map(item).join('');
  if (html === lastTicker) return;
  lastTicker = html;
  track.className = 'track';
  track.innerHTML = html;
  requestAnimationFrame(() => {
    const w = track.scrollWidth, box = tickerEl.clientWidth;
    if (w > box) {
      track.innerHTML = html + html;               // second copy makes the -50% loop seamless
      track.style.setProperty('--dur', Math.max(20, Math.round(w / 55)) + 's');
      track.className = 'track roll';
    }
  });
}

function renderStatus() {
  if (M) {
    const p = [];
    if (state.demo) p.push('<span class="demo">Demo</span>');
    else if (week) p.push('Wk ' + week);
    if (loading) p.push('updating…');
    else if (lastOk) p.push(new Date(lastOk).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    if (lastErr && (lastOk || !state.demo)) p.push('<span class="err">' + (lastOk ? 'refresh failed' : esc(lastErr)) + '</span>');
    statusEl.innerHTML = p.map(x => '<span>' + x + '</span>').join('<span class="muted">·</span>');
    return;
  }
  const parts = [];
  if (state.demo) parts.push('<span class="demo">DEMO DATA · not live</span>');
  else if (week) parts.push('Week ' + week + (season ? ' · ' + season : ''));
  if (lastOk) parts.push('updated ' + new Date(lastOk).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }));
  if (loading) parts.push('refreshing…');
  else if (nextAt) parts.push('next in ' + Math.max(0, Math.ceil((nextAt - Date.now()) / 1000)) + 's');
  if (lastErr && lastOk) parts.push('<span class="err">last refresh failed (' + esc(lastErr) + ')</span>');
  if (lastErr && !lastOk && !state.demo) parts.push('<span class="err">' + esc(lastErr) + '</span>');
  statusEl.innerHTML = parts.map(p => '<span>' + p + '</span>').join('<span class="muted">·</span>');
}
setInterval(renderStatus, 1000);

// ---------- panel ----------
let tab = 'picks';
function openPanel(t) { if (t) tab = t; panel.hidden = false; document.body.classList.remove('idle'); renderPanel(); }
function closePanel() { panel.hidden = true; }
function renderPanel() {
  panel.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  panel.querySelectorAll('section').forEach(s => s.hidden = s.id !== 'tab-' + tab);
  const sec = $('#tab-' + tab), top = sec.scrollTop;
  if (tab === 'picks') sec.innerHTML = picksHTML();
  else if (tab === 'teams') { sec.innerHTML = teamsHTML(); ensureTeams(); }
  else sec.innerHTML = settingsHTML();
  sec.scrollTop = top;
}

let pickFilter = { conf: null, ranked: false, live: false };   // transient, not saved
function pickRows(list) { return list.filter(g => (!pickFilter.conf || g.away.conf === pickFilter.conf || g.home.conf === pickFilter.conf) && (!pickFilter.ranked || g.away.rank || g.home.rank) && (!pickFilter.live || g.state === 'in')); }
function dayKey(g) { return g.date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); }
function picksHTML() {
  if (!games.length) return '<p class="muted">' + (lastErr ? 'No slate loaded yet — ' + esc(lastErr) : 'Loading the slate…') + '</p>';
  const fs = favIds();
  const onBoard = boardGames();
  const shown = pickRows(games);
  // conference chips from the slate, most games first
  const counts = new Map();
  games.forEach(g => new Set([g.away.conf, g.home.conf].filter(Boolean)).forEach(c => counts.set(c, (counts.get(c) || 0) + 1)));
  const confs = [...counts.entries()].sort((a, b) => b[1] - a[1] || confName(a[0]).localeCompare(confName(b[0])));
  const anyConf = confs.length > 0;
  let h = '<div class="ph"><span><b>' + (state.demo ? 'Demo slate' : 'Week ' + (week || '?')) + '</b> · ' + games.length + ' games · <b>' + onBoard.length + '</b> on board</span>' +
    '<span><button class="btn sm" data-act="reset">Reset to favorites</button> <button class="btn sm" data-act="clear">Clear all</button></span></div>';
  h += '<div class="chips">' +
    '<button class="chip' + (!pickFilter.conf ? ' on' : '') + '" data-chip="conf" data-v="">All</button>' +
    confs.map(([c, n]) => '<button class="chip' + (pickFilter.conf === c ? ' on' : '') + '" data-chip="conf" data-v="' + esc(c) + '">' + esc(confName(c)) + '<small>' + n + '</small></button>').join('') +
    (anyConf ? '' : '<span class="note">No conference data in this slate.</span>') +
    '<button class="chip' + (pickFilter.ranked ? ' on' : '') + '" data-chip="ranked">Ranked</button>' +
    '<button class="chip live' + (pickFilter.live ? ' on' : '') + '" data-chip="live">Live now</button></div>';
  h += '<div class="tools"><span class="seg"><button data-act="group" data-v="day"' + (state.pickGroup !== 'conf' ? ' class="on"' : '') + '>By day</button><button data-act="group" data-v="conf"' + (state.pickGroup === 'conf' ? ' class="on"' : '') + '>By conference</button></span>' +
    '<span class="muted" style="font-size:12px">' + shown.length + ' shown</span>' +
    '<button class="btn sm" data-act="tickall">Tick shown</button><button class="btn sm" data-act="untickall">Untick shown</button></div>';
  h += '<div class="note">★ = involves a favorite team or conference, on by default. Ticking or unticking overrides that for this week only. Upset watches are pulled onto the board automatically' + (state.autoUpset ? '' : ' (off in Settings)') + '.</div>';
  if (state.orderMode === 'manual' && onBoard.length > 1) {
    h += '<h4>Board order</h4>' + onBoard.map((g, i) => '<div class="ord"><span class="muted">' + (i + 1) + '</span><span class="g">' + matchup(g, true) + '</span>' +
      '<button class="btn sm" data-act="up" data-id="' + esc(g.id) + '"' + (i === 0 ? ' disabled' : '') + '>&uarr;</button><button class="btn sm" data-act="down" data-id="' + esc(g.id) + '"' + (i === onBoard.length - 1 ? ' disabled' : '') + '>&darr;</button></div>').join('');
  }
  // grouping
  const groups = new Map();
  const add = (k, g) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(g); };
  const sorted = shown.slice().sort((a, b) => a.date - b.date);
  if (state.pickGroup === 'conf') {
    sorted.forEach(g => { const cs = new Set([g.away.conf, g.home.conf].filter(Boolean)); if (!cs.size) add('Other', g); cs.forEach(c => add(confName(c), g)); });
  } else {
    sorted.forEach(g => add(dayKey(g), g));
  }
  const keys = state.pickGroup === 'conf' ? [...groups.keys()].sort((a, b) => a.localeCompare(b)) : [...groups.keys()];
  for (const k of keys) {
    const list = groups.get(k).slice().sort((a, b) => (state.pickGroup === 'conf' ? stateRank(a) - stateRank(b) : 0) || dramaRank(a) - dramaRank(b) || (a.date - b.date));
    h += '<h4>' + esc(k) + (state.pickGroup === 'conf' ? ' <span class="muted">· ' + list.length + '</span>' : '') + '</h4>';
    for (const g of list) {
      const st = statusLabel(g), fav = isFavGame(g, fs), on = isPicked(g, fs);
      const auto = on && state.overrides[g.id] == null && !fav;
      const rowCls = 'row' + (g.up && g.up.tier !== 'final' ? ' ' + upCls(g) : (state.closeEdge && g.close ? ' close' : ''));
      h += '<label class="' + rowCls + '"><input type="checkbox" data-id="' + esc(g.id) + '"' + (on ? ' checked' : '') + '>' +
        '<span class="t">' + (g.up ? upsetBadge(g, 'b') : esc(fmtTime(g.date)) + (state.pickGroup === 'conf' && !sameDay(g.date, new Date()) ? (M ? ' ' : '<br>') + esc(g.date.toLocaleDateString([], { weekday: 'short' })) : '')) + '</span>' +
        '<span class="g">' + matchup(g, true) + (g.confLabel && state.pickGroup !== 'conf' ? '<span class="cf">' + esc(g.confLabel) + '</span>' : '') + '</span>' +
        '<span class="s ' + st.kind + '">' + (g.state === 'pre' ? esc(g.network) : esc(g.away.score + '–' + g.home.score + ' · ' + st.text)) + '</span>' +
        '<span class="star">' + (fav ? '★' : (auto ? '<span class="auto" title="On the board because of the upset watch">auto</span>' : '')) + '</span></label>';
    }
  }
  if (!shown.length) h += '<p class="muted">Nothing matches those chips.</p>';
  return h;
}

function teamsHTML(filter) {
  let h = '<h4>Favorites <span class="muted">(their games are always on the board)</span></h4>';
  if (!state.favorites.length) h += '<p class="muted">None yet.</p>';
  h += state.favorites.map((f, i) => '<div class="favrow">' + (f.logo ? '<img src="' + esc(f.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '') +
    '<span class="g">' + esc(f.name) + ' <small class="muted">' + esc(f.abbr) + '</small></span>' +
    '<button class="btn sm" data-act="fup" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>&uarr;</button>' +
    '<button class="btn sm" data-act="fdown" data-i="' + i + '"' + (i === state.favorites.length - 1 ? ' disabled' : '') + '>&darr;</button>' +
    '<button class="btn sm" data-act="frm" data-i="' + i + '" title="Remove">&#10005;</button></div>').join('');
  h += '<h4>Favorite conferences <span class="muted">(every game involving one of its teams)</span></h4><div class="chips">' +
    Object.keys(CONF).map(c => '<button class="chip' + (state.favConfs.includes(c) ? ' on' : '') + '" data-act="fconf" data-v="' + c + '">' + esc(confName(c)) + '</button>').join('') + '</div>' +
    (state.favConfs.length ? '<div class="note">One conference is roughly 7–8 games a week; pair it with "Finals: hide" to keep the board readable.</div>' : '');
  h += '<h4>Add a team</h4><input type="search" id="tsearch" placeholder="Search FBS teams…" autocomplete="off" value="' + esc(filter || '') + '">';
  h += '<div id="tlist">' + teamListHTML(filter || '') + '</div>';
  return h;
}
function teamListHTML(q) {
  const fs = favIds();
  let pool = allTeams;
  if (!pool) {
    const m = new Map();
    games.forEach(g => [g.away, g.home].forEach(t => { if (t.id && !m.has(t.id)) m.set(t.id, { id: t.id, name: t.name, abbr: t.abbr, logo: t.logo }); }));
    pool = [...m.values()];
    if (!pool.length) return '<p class="muted">Loading team list…</p>';
  }
  q = (q || '').trim().toLowerCase();
  let list = pool.filter(t => !fs.has(t.id) && (!q || t.name.toLowerCase().includes(q) || (t.abbr || '').toLowerCase().includes(q) || (t.full || '').toLowerCase().includes(q)));
  list.sort((a, b) => a.name.localeCompare(b.name));
  const note = allTeams ? '' : '<p class="note">Showing teams in this week\'s slate' + (state.demo ? ' (demo)' : ' while the full list loads') + '.</p>';
  return note + list.slice(0, 60).map(t => '<div class="tl">' + (t.logo ? '<img src="' + esc(t.logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '') +
    '<span class="g">' + esc(t.name) + '<small>' + esc(t.abbr) + '</small></span><button class="btn sm" data-act="fadd" data-id="' + esc(t.id) + '">Add</button></div>').join('') +
    (list.length > 60 ? '<p class="note">' + (list.length - 60) + ' more — keep typing to narrow.</p>' : '') + (!list.length ? '<p class="muted">No match.</p>' : '');
}
async function ensureTeams() {
  if (allTeams) return;
  try {
    const c = JSON.parse(localStorage.getItem(TKEY) || 'null');
    if (c && c.at && Date.now() - c.at < 30 * 864e5 && Array.isArray(c.teams) && c.teams.length > 50) { allTeams = c.teams; if (tab === 'teams') renderPanel(); return; }
  } catch (e) { /* ignore */ }
  if (state.demo) return;
  try {
    const j = await fetchJSON(API + '/teams?groups=80&limit=200');
    const arr = (((j.sports || [])[0] || {}).leagues || [])[0]?.teams || [];
    const teams = arr.map(x => x.team || {}).filter(t => t.id).map(t => ({ id: String(t.id), name: t.shortDisplayName || t.displayName || t.name, full: t.displayName || '', abbr: t.abbreviation || '', logo: (t.logos && t.logos[0] && t.logos[0].href) || t.logo || '' }));
    if (teams.length) { allTeams = teams; try { localStorage.setItem(TKEY, JSON.stringify({ at: Date.now(), teams })); } catch (e) { /* ignore */ } if (tab === 'teams') renderPanel(); }
  } catch (e) { /* the slate-derived list stays in place */ }
}

function settingsHTML() {
  const sel = (name, opts, val) => '<select data-set="' + name + '">' + opts.map(([v, l]) => '<option value="' + v + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';
  const chk = (name, val) => '<input type="checkbox" data-set="' + name + '"' + (val ? ' checked' : '') + '>';
  return '<div class="set"><div><label>Refresh every</label></div>' + sel('refresh', [[15, '15 s'], [30, '30 s'], [60, '60 s'], [120, '2 min']], state.refresh) + '</div>' +
    '<div class="set"><div><label>Finals</label><small>Finished games on the board</small></div>' + sel('finals', [['dim', 'Show, dimmed'], ['show', 'Show'], ['hide', 'Hide (move to ticker)']], state.finals) + '</div>' +
    '<div class="set"><div><label>Board order</label><small>Auto: live first (upset alerts and close games on top), then upcoming, then finals</small></div>' + sel('orderMode', [['auto', 'Auto'], ['conf', 'By conference'], ['manual', 'Manual (arrows in Picks)']], state.orderMode) + '</div>' +
    '<div class="set"><div><label>Conference tag on cards</label></div>' + chk('confTags', state.confTags) + '</div>' +
    '<h4>Upset watch</h4>' +
    '<div class="set"><div><label>Underdog by at least</label><small>From the pregame line; ranked-vs-unranked when there is no line</small></div>' + sel('upsetSpread', [[3, '3 points'], [7, '7 points'], [10, '10 points'], [14, '14 points']], state.upsetSpread) + '</div>' +
    '<div class="set"><div><label>"Late" means</label></div>' + sel('late', [['4th', '4th quarter or OT'], ['2h', 'Second half']], state.late) + '</div>' +
    '<div class="set"><div><label>Pull upset watches onto the board</label><small>Even if you never ticked the game; it stays until it ends</small></div>' + chk('autoUpset', state.autoUpset) + '</div>' +
    '<div class="set"><div><label>Red edge on close games</label><small>Any game within one score late, no underdog logic</small></div>' + chk('closeEdge', state.closeEdge) + '</div>' +
    '<h4>Display</h4>' +
    '<div class="set"><div><label>Team labels</label><small>Auto switches to abbreviations at 9+ games</small></div>' + sel('labels', [['auto', 'Auto'], ['name', 'Names'], ['abbr', 'Abbreviations']], state.labels) + '</div>' +
    '<div class="set"><div><label>Ticker of other games</label><small>Everything not on the board scrolls along the bottom</small></div>' + chk('ticker', state.ticker) + '</div>' +
    '<div class="set"><div><label>TV network</label></div>' + chk('showNetwork', state.showNetwork) + '</div>' +
    '<div class="set"><div><label>Records</label></div>' + chk('showRecords', state.showRecords) + '</div>' +
    '<div class="set"><div><label>Point spread on upcoming games</label></div>' + chk('showOdds', state.showOdds) + '</div>' +
    '<div class="set"><div><label>Demo data</label><small>Built-in sample games for checking the layout. Not live.</small></div>' + chk('demo', state.demo) + '</div>' +
    '<div class="set"><div><label>Fullscreen</label><small>Or press F, or double-click the board</small></div><button class="btn" data-act="fs">Toggle</button></div>' +
    '<div class="set"><div><label>Refresh now</label></div><button class="btn" data-act="refresh">Refresh</button></div>' +
    '<h4>Move settings to another ' + (M ? 'device' : 'computer') + '</h4><textarea id="io" spellcheck="false">' + esc(JSON.stringify({ favorites: state.favorites, favConfs: state.favConfs, refresh: state.refresh, ticker: state.ticker, finals: state.finals, showOdds: state.showOdds, showRecords: state.showRecords, showNetwork: state.showNetwork, labels: state.labels, orderMode: state.orderMode, upsetSpread: state.upsetSpread, late: state.late, autoUpset: state.autoUpset, closeEdge: state.closeEdge, confTags: state.confTags })) + '</textarea>' +
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-act="copy">Copy</button><button class="btn" data-act="import">Apply pasted text</button><span id="iomsg" class="muted" style="align-self:center"></span></div>' +
    '<div class="keys"><kbd>F</kbd> fullscreen &nbsp; <kbd>P</kbd> picks &nbsp; <kbd>T</kbd> ticker &nbsp; <kbd>H</kbd> hide/show finals &nbsp; <kbd>R</kbd> refresh &nbsp; <kbd>D</kbd> demo &nbsp; <kbd>Esc</kbd> close</div>' +
    '<div class="note">v3 · Scores and pregame lines come from ESPN\'s public scoreboard feed (FBS only). Your picks and favorites are saved in this browser.</div>';
}

// panel interactions
panel.addEventListener('click', e => {
  const nb = e.target.closest('nav button'); if (nb) { tab = nb.dataset.tab; renderPanel(); return; }
  if (e.target.closest('#close')) { closePanel(); return; }
  const ch = e.target.closest('[data-chip]');
  if (ch) {
    const k = ch.dataset.chip;
    if (k === 'conf') pickFilter.conf = ch.dataset.v || null; else pickFilter[k] = !pickFilter[k];
    renderPanel(); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i;
  const fs = favIds();
  if (act === 'reset') { state.overrides = {}; }
  else if (act === 'clear') { state.overrides = {}; games.forEach(g => { if (isFavGame(g, fs) || isAutoUpset(g)) state.overrides[g.id] = false; }); }
  else if (act === 'tickall' || act === 'untickall') {
    const on = act === 'tickall';
    pickRows(games).forEach(g => { const def = isFavGame(g, fs) || isAutoUpset(g); if (on === def) delete state.overrides[g.id]; else state.overrides[g.id] = on; });
  }
  else if (act === 'group') { state.pickGroup = b.dataset.v; }
  else if (act === 'fconf') { const c = b.dataset.v; state.favConfs = state.favConfs.includes(c) ? state.favConfs.filter(x => x !== c) : state.favConfs.concat(c); }
  else if (act === 'up' || act === 'down') {
    const ord = boardGames().map(g => g.id); const k = ord.indexOf(id); const j = act === 'up' ? k - 1 : k + 1;
    if (k >= 0 && j >= 0 && j < ord.length) { [ord[k], ord[j]] = [ord[j], ord[k]]; state.order = ord; }
  }
  else if (act === 'fup' || act === 'fdown') { const j = act === 'fup' ? i - 1 : i + 1; if (j >= 0 && j < state.favorites.length) { const f = state.favorites; [f[i], f[j]] = [f[j], f[i]]; } }
  else if (act === 'frm') { state.favorites.splice(i, 1); }
  else if (act === 'fadd') {
    const pool = allTeams || []; let t = pool.find(x => x.id === id);
    if (!t) games.forEach(g => [g.away, g.home].forEach(x => { if (x.id === id) t = { id: x.id, name: x.name, abbr: x.abbr, logo: x.logo }; }));
    if (t && !fs.has(t.id)) state.favorites.push({ id: t.id, name: t.name, abbr: t.abbr, logo: t.logo });
    const q = $('#tsearch') ? $('#tsearch').value : '';
    save(); renderBoard(); renderTicker(); $('#tab-teams').innerHTML = teamsHTML(q); const inp = $('#tsearch'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    return;
  }
  else if (act === 'fs') { toggleFullscreen(); return; }
  else if (act === 'refresh') { refresh(); return; }
  else if (act === 'copy') { const ta = $('#io'); ta.select(); navigator.clipboard?.writeText(ta.value).then(() => { $('#iomsg').textContent = 'Copied.'; }, () => { $('#iomsg').textContent = 'Select the text and copy it.'; }); return; }
  else if (act === 'import') {
    try {
      const j = JSON.parse($('#io').value);
      if (Array.isArray(j.favorites)) state.favorites = j.favorites.filter(f => f && f.id).map(f => ({ id: String(f.id), name: String(f.name || ''), abbr: String(f.abbr || ''), logo: String(f.logo || '') }));
      if (Array.isArray(j.favConfs)) state.favConfs = j.favConfs.map(String).filter(c => CONF[c]);
      for (const k of ['refresh', 'ticker', 'finals', 'showOdds', 'showRecords', 'showNetwork', 'labels', 'orderMode', 'upsetSpread', 'late', 'autoUpset', 'closeEdge', 'confTags']) if (k in j) state[k] = j[k];
    } catch (err) { $('#iomsg').textContent = 'That is not valid settings text.'; return; }
  }
  save(); renderAll();
  if (act === 'import') { const m = $('#iomsg'); if (m) m.textContent = 'Applied.'; }
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=checkbox][data-id]')) {
    const g = games.find(x => x.id === t.dataset.id); if (!g) return;
    const def = isFavGame(g) || isAutoUpset(g);
    if (t.checked === def) delete state.overrides[g.id]; else state.overrides[g.id] = t.checked;
    save(); renderBoard(); renderTicker();
    const ph = $('#tab-picks .ph b:last-of-type'); if (ph) ph.textContent = boardGames().length;
    return;
  }
  if (t.dataset.set) {
    const k = t.dataset.set;
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'refresh' || k === 'upsetSpread') v = +v;
    if (k === 'demo' && v) { /* switching to demo */ }
    state[k] = v; save();
    if (k === 'upsetSpread' || k === 'late' || k === 'autoUpset') autoStuck.clear();
    if (k === 'demo' || k === 'refresh') { nextAt = 0; refresh(); schedule(); }
    else renderAll();
  }
});
panel.addEventListener('input', e => {
  if (e.target.id === 'tsearch') { $('#tlist').innerHTML = teamListHTML(e.target.value); }
});

// ---------- global controls ----------
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
}
$('#gear').addEventListener('click', () => panel.hidden ? openPanel() : closePanel());
board.addEventListener('dblclick', toggleFullscreen);
function doKey(k) {
  if (k === 'f') toggleFullscreen();
  else if (k === 'p' || k === ',') panel.hidden ? openPanel() : closePanel();
  else if (k === 'escape') closePanel();
  else if (k === 't') { state.ticker = !state.ticker; save(); renderAll(); }
  else if (k === 'h') { state.finals = state.finals === 'hide' ? 'dim' : 'hide'; save(); renderAll(); }
  else if (k === 'r') { nextAt = 0; refresh(); }
  else if (k === 'd') { state.demo = !state.demo; save(); nextAt = 0; refresh(); }
  else return false;
  return true;
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) { if (e.key === 'Escape') closePanel(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (doKey(e.key.toLowerCase())) e.preventDefault();
});
// v3: tap controls
const mb = $('#mb');
function syncMB() {
  mb.querySelector('[data-k=h]').setAttribute('aria-pressed', String(state.finals !== 'hide'));
  mb.querySelector('[data-k=t]').setAttribute('aria-pressed', String(!!state.ticker));
  mb.querySelector('[data-k=f]').hidden = !document.fullscreenEnabled;
}
mb.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) doKey(b.dataset.k); });
MQ.addEventListener('change', () => { M = MQ.matches; document.body.classList.toggle('m', M); lastBW = 0; renderAll(); });
let idleT;
function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (panel.hidden) document.body.classList.add('idle'); }, 3500); }
['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, poke, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastOk > 10000) { nextAt = 0; refresh(); } });

// ---------- go ----------
poke();
refresh();
schedule();
})();
</script>
</body>
</html>
